name: Component checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint --silent
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build (Next)
        run: npm run build --silent
      - name: Run unit tests
        run: npm ci && npm run test:ci
      - name: Component smoke check
        run: npm run test:components
